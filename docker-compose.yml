services:
  api:
    build: .
    environment:
      DATABASE_URL: postgres://booking:booking@postgres:5432/booking
    ports:
      - '3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://localhost:3000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))",
        ]
      interval: 2s
      timeout: 3s
      retries: 15

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - '54329:5432'
    healthcheck:
      # Over TCP: during first-run init the image serves a temporary,
      # socket-only server that pg_isready would otherwise report as ready.
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U booking -d booking']
      interval: 2s
      timeout: 3s
      retries: 15
